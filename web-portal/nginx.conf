server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security Headers ────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=()" always;

    # ── Gzip Compression ────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/x-javascript
        text/xml
        application/xml
        image/svg+xml;

    # ── Static Assets: aggressive caching ───────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Health probe endpoint (for Docker HEALTHCHECK) ───────────────
    location = /health.txt {
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # ── Reverse proxy to Analytics API ──────────────────────────────
    # In Docker Compose, analytics-api is the service hostname.
    # In K8s, this header is handled by the Ingress instead.
    location /api/ {
        proxy_pass http://analytics-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # ── SPA fallback: all other routes → index.html ─────────────────
    # This is the critical config for React Router client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
