name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build, Test & Analyze
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v6

      # ── JDK Setup ────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      # ── Firebase credentials (from GitHub Secret) ────────────
      - name: Provision google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${GOOGLE_SERVICES_JSON:-}" ]]; then
            # Support either raw JSON or base64-encoded JSON in the secret.
            if [[ "$GOOGLE_SERVICES_JSON" =~ ^[[:space:]]*\{ ]]; then
              printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            else
              printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
            fi
          elif [[ ! -f app/google-services.json ]]; then
            echo "Missing Firebase config: set GOOGLE_SERVICES_JSON secret or commit app/google-services.json."
            exit 1
          fi

          python3 -c "import json; json.load(open('app/google-services.json', encoding='utf-8'))"

      # ── local.properties for CI ──────────────────────────────
      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "MAPS_API_KEY=" >> local.properties

      # ── Gradle Cache ─────────────────────────────────────────
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # ── Build, tests and static analysis ─────────────────────
      - name: Run tests, coverage, analysis, and build
        run: ./gradlew jacocoTestReport detekt lint assembleDebug --no-daemon

      # ── Upload Artifacts ─────────────────────────────────────
      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-coverage-report
          path: app/build/reports/jacoco/jacocoTestReport/html/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: app/build/reports/tests/
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            sdk/build/reports/lint-results-debug.html
          retention-days: 14

      - name: Upload Detekt report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: detekt-report
          path: app/build/reports/detekt/
          retention-days: 14

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  web-e2e:
    name: Web E2E (emulators + playwright)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install web deps
        run: |
          cd web-portal
          npm ci
      - name: Start Firebase emulators
        run: |
          cd web-portal
          npx firebase-tools emulators:start --only auth,firestore --project roadguard-demo &
          sleep 6
      - name: Seed Firestore
        run: |
          cd web-portal
          node scripts/seed-firestore-test-data.mjs
      - name: Start dev server
        run: |
          cd web-portal
          npm run dev &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4501/ >/dev/null; then
              echo "Dev server is up"
              break
            fi
            if [[ "$i" -eq 40 ]]; then
              echo "Dev server did not become ready"
              exit 1
            fi
            sleep 1
          done
      - name: Install Playwright browsers
        run: |
          cd web-portal
          npx playwright install --with-deps
      - name: Run Playwright tests
        run: |
          cd web-portal
          PLAYWRIGHT_JUNIT_OUTPUT_NAME=playwright-junit.xml npm run test:e2e -- --reporter=junit,html --output=test-results

      - name: Upload Playwright JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-playwright-junit
          path: web-portal/playwright-junit.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright HTML report and traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-playwright-report
          path: |
            web-portal/playwright-report/
            web-portal/test-results/
          if-no-files-found: warn
          retention-days: 14

  web-docker:
    name: Web Docker Build
    runs-on: ubuntu-latest
    needs: web-e2e
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build web-portal image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./web-portal
          file: ./web-portal/Dockerfile
          push: false
          tags: roadguard-web-portal:ci
