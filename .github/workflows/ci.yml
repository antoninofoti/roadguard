name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    name: Build, Test & Analyze
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v6

      # ── JDK Setup ────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── Firebase credentials (from GitHub Secret) ────────────
      - name: Provision google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${GOOGLE_SERVICES_JSON:-}" ]]; then
            # Support either raw JSON or base64-encoded JSON in the secret.
            if [[ "$GOOGLE_SERVICES_JSON" =~ ^[[:space:]]*\{ ]]; then
              printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            else
              printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
            fi
          elif [[ ! -f app/google-services.json ]]; then
            echo "Missing Firebase config: set GOOGLE_SERVICES_JSON secret or commit app/google-services.json."
            exit 1
          fi

          python3 -c "import json; json.load(open('app/google-services.json', encoding='utf-8'))"

      # ── local.properties for CI ──────────────────────────────
      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "MAPS_API_KEY=" >> local.properties

      # ── Gradle Cache ─────────────────────────────────────────
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # ── JaCoCo Coverage ──────────────────────────────────────
      - name: Run unit tests and generate JaCoCo coverage report
        run: ./gradlew jacocoTestReport --no-daemon

      # ── Detekt Static Analysis ───────────────────────────────
      - name: Run Detekt
        run: ./gradlew detekt --no-daemon

      # ── Android Lint ─────────────────────────────────────────
      - name: Run Android Lint
        run: ./gradlew lint --no-daemon

      # ── Build Debug APK ──────────────────────────────────────
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      # ── Upload Artifacts ─────────────────────────────────────
      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-coverage-report
          path: app/build/reports/jacoco/jacocoTestReport/html/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: app/build/reports/tests/
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            sdk/build/reports/lint-results-debug.html
          retention-days: 14

      - name: Upload Detekt report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: detekt-report
          path: app/build/reports/detekt/
          retention-days: 14

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
