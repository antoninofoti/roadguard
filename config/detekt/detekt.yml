# Detekt Configuration for RoadGuard
# https://detekt.dev/docs/introduction/configurations

complexity:
  active: true
  LongMethod:
    active: true
    threshold: 150
  LongParameterList:
    active: true
    constructorThreshold: 8
    functionThreshold: 10
  CyclomaticComplexMethod:
    active: true
    threshold: 20
  TooManyFunctions:
    active: true
    thresholdInFiles: 20
    thresholdInClasses: 20
  NestedBlockDepth:
    active: true
    threshold: 5

coroutines:
  active: true

exceptions:
  active: true
  TooGenericExceptionCaught:
    active: true
    allowedExceptionNameRegex: '_|(ignore|expected|e|exc).*'

naming:
  active: true
  MatchingDeclarationName:
    active: false
  FunctionNaming:
    active: true
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*'
  VariableNaming:
    active: true
  TopLevelPropertyNaming:
    active: true
    constantPattern: '[A-Z][_A-Z0-9]*'
  PackageNaming:
    active: true

performance:
  active: true
  SpreadOperator:
    active: false  # Common in Android/Compose code

potential-bugs:
  active: true

style:
  active: true
  MagicNumber:
    active: false
    ignoreNumbers:
      - '-1'
      - '0'
      - '0.0'
      - '1'
      - '1.0'
      - '2'
      - '0.5'
      - '100'
    ignoreAnnotation: true
    ignoreEnums: true
    ignorePropertyDeclaration: true
    ignoreLocalVariableDeclaration: true
    ignoreNamedArgument: true
    ignoreConstantDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreHashCodeFunction: true
  WildcardImport:
    active: false  # Required by Compose conventions
  MaxLineLength:
    active: true
    maxLineLength: 150
  UnusedPrivateMember:
    active: true
    allowedNames: '(_|ignored|expected|serialVersionUID)'
  ReturnCount:
    active: true
    max: 4
  ForbiddenComment:
    active: false

empty-blocks:
  active: true
  EmptyFunctionBlock:
    active: true
    ignoreOverridden: true
  EmptyKtFile:
    active: false
