apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: roadguard-web
  namespace: roadguard
  annotations:
    haproxy.router.openshift.io/timeout: 60s
    haproxy.router.openshift.io/hsts_header: max-age=31536000;includeSubDomains
  labels:
    app.kubernetes.io/part-of: roadguard-system
spec:
  host: roadguard-web.apps.example.com
  to:
    kind: Service
    name: web-portal
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: roadguard-api
  namespace: roadguard
  annotations:
    haproxy.router.openshift.io/timeout: 60s
    haproxy.router.openshift.io/hsts_header: max-age=31536000;includeSubDomains
  labels:
    app.kubernetes.io/part-of: roadguard-system
spec:
  host: roadguard-api.apps.example.com
  to:
    kind: Service
    name: analytics-api
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
