apiVersion: v1
kind: Service
metadata:
  name: web-portal
  namespace: roadguard
  labels:
    app: web-portal
    app.kubernetes.io/name: web-portal
    app.kubernetes.io/part-of: roadguard-system
spec:
  # ClusterIP: only reachable within the cluster.
  # External traffic arrives via the Ingress → this Service.
  type: ClusterIP
  selector:
    app: web-portal
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
