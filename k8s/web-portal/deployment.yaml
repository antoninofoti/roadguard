apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-portal
  namespace: roadguard
  labels:
    app: web-portal
    app.kubernetes.io/name: web-portal
    app.kubernetes.io/part-of: roadguard-system
    app.kubernetes.io/version: "1.0.0"
spec:
  # 2 replicas for high availability — load balanced by the Service
  replicas: 2
  selector:
    matchLabels:
      app: web-portal
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Zero-downtime: bring up 1 new pod before terminating old ones
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: web-portal
    spec:
      # Security context: run as non-root (nginx default user)
      securityContext:
        runAsNonRoot: false   # nginx needs root to bind port 80; use rootless nginx in prod
        fsGroup: 101
      containers:
        - name: web-portal
          image: roadguard/web-portal:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              protocol: TCP

          # Resource limits: prevent the container from starving other pods
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"

          # Liveness probe: restart container if Nginx stops responding
          livenessProbe:
            httpGet:
              path: /health.txt
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3

          # Readiness probe: only send traffic when Nginx is ready
          readinessProbe:
            httpGet:
              path: /health.txt
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 2
