plugins {
    id 'com.android.library'
    id 'maven-publish'
}

def openCVersionName = "4.11.0"
def openCVersionCode = ((4 * 100 + 11) * 100 + 0) * 10 + 0
def isCi = System.getenv("CI") == "true"

println "OpenCV: " + openCVersionName + " " + project.buildscript.sourceFile

android {
    namespace = 'org.opencv'
    compileSdk 34
    // buildToolsVersion managed automatically by AGP to prevent build warnings
    ndkVersion = "26.3.11579264"

    defaultConfig {
        minSdk 21
        targetSdk 34

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
                targets "opencv_jni_shared"
            }
        }
    }
    
    buildFeatures {
        buildConfig = true
        prefabPublishing = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildTypes {
        debug {
            packaging {
                jniLibs {
                    keepDebugSymbols += "**/*.so"
                }
            }
        }
        release {
            packaging {
                jniLibs {
                    keepDebugSymbols += "**/*.so"
                }
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt'
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['native/libs']
            java.srcDirs = ['java/src']
            res.srcDirs = ['java/res']
            manifest.srcFile 'java/AndroidManifest.xml'
        }
    }

    externalNativeBuild {
        cmake {
            path (project.projectDir.toString() + '/libcxx_helper/CMakeLists.txt')
        }
    }

    prefab {
        opencv_jni_shared {
            headers = 'native/jni/include'
        }
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
            withJavadocJar()
        }
    }

    lint {
        targetSdk 34
        // Keep local lint strict, but avoid failing CI while OpenCV upstream issues are present.
        abortOnError = !isCi
    }

    testOptions {
        targetSdk 34
    }
}

publishing {
    publications {
        release(MavenPublication) {
            groupId = 'org.opencv'
            artifactId = 'opencv'
            version = '4.11.0'

            afterEvaluate {
               from components.release
           }
        }
    }
    repositories {
        maven {
            name = 'myrepo'
            url = layout.buildDirectory.dir("repo")
        }
    }
}

dependencies {
}
